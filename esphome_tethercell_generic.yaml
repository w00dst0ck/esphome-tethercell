substitutions:
  uuid: # based on uuid source https://github.com/sandeepmistry/node-tethercell/blob/master/tethercell.txt
    service: 5EC0FFF0-3CF2-A682-E211-2AF96EFDF667
    fet_state: 5EC0FFF2-3CF2-A682-E211-2AF96EFDF667
    battery_voltage: 5EC0FFF3-3CF2-A682-E211-2AF96EFDF667
    authorization: 5EC0FFFC-3CF2-A682-E211-2AF96EFDF667

ble_client:
  - mac_address: ${tethercell_mac}
    id: tethercell_device_${tethercell_number}
    auto_connect: true
    on_connect:
      then:
        - lambda: |-
            ESP_LOGI("ble_client_lambda", "Client connected to Tethercell ${tethercell_number}");
        - lambda: |-
            ESP_LOGI("ble_client_lambda", "Sending auth to Tethercell ${tethercell_number}");
        - ble_client.ble_write: # send the authentication PIN to activate the service announcement
            id: tethercell_device_${tethercell_number}
            service_uuid: ${uuid.service}
            characteristic_uuid: ${uuid.authorization}
            value: !lambda |-
              uint32_t val = strtoul("${tethercell_pin}", nullptr, 10);
              return std::vector<uint8_t>{
                (uint8_t)((val >> 24) & 0xFF),
                (uint8_t)((val >> 16) & 0xFF),
                (uint8_t)((val >> 8) & 0xFF),
                (uint8_t)(val & 0xFF)
              };
        - lambda: |- # get current switch state from sensor value
            auto sensors = {
              &id(sensor_tethercell_1_fet_state),
              &id(sensor_tethercell_2_fet_state),
              &id(sensor_tethercell_3_fet_state),
              &id(sensor_tethercell_4_fet_state),
              &id(sensor_tethercell_5_fet_state),
              &id(sensor_tethercell_6_fet_state),
              &id(sensor_tethercell_7_fet_state),
              &id(sensor_tethercell_8_fet_state),
              &id(sensor_tethercell_9_fet_state),
              &id(sensor_tethercell_10_fet_state)
            };

            auto switches = {
              &id(switch_tethercell_1),
              &id(switch_tethercell_2),
              &id(switch_tethercell_3),
              &id(switch_tethercell_4),
              &id(switch_tethercell_5),
              &id(switch_tethercell_6),
              &id(switch_tethercell_7),
              &id(switch_tethercell_8),
              &id(switch_tethercell_9),
              &id(switch_tethercell_10)
            };

            for (int i = 0; i < 10; i++) {
              if (sensors[i]->state) {
                switches[i]->turn_on();
              } else {
                switches[i]->turn_off();
              }
            }
    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGI("ble_client_lambda", "Client disconnected from Tethercell ${tethercell_number}");
            
sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: tethercell_device_${tethercell_number}
    name: "Tethercell ${tethercell_number} FET State"
    id: sensor_tethercell_${tethercell_number}_fet_state
    service_uuid: ${uuid.service}
    characteristic_uuid: ${uuid.fet_state}
    icon: mdi:variable
  - platform: ble_client
    type: characteristic
    ble_client_id: tethercell_device_${tethercell_number}
    name: "Tethercell ${tethercell_number} Battery voltage"
    id: sensor_tethercell_${tethercell_number}_battery_voltage
    service_uuid: ${uuid.service}
    characteristic_uuid: ${uuid.battery_voltage}
    icon: mdi:variable

switch:
  - platform: template
    name: "Tethercell ${tethercell_number} FET"
    id: switch_tethercell_${tethercell_number}_fet
    optimistic: true
    icon: mdi:battery-bluetooth
    turn_on_action:
      - ble_client.ble_write: # send authentication pin
          id: tethercell_device_${tethercell_number}
          service_uuid: ${uuid.service}
          characteristic_uuid: ${uuid.authorization}
          value: !lambda |-
            uint32_t val = strtoul("${tethercell_pin}", nullptr, 10);
            return std::vector<uint8_t>{
              (uint8_t)((val >> 24) & 0xFF),
              (uint8_t)((val >> 16) & 0xFF),
              (uint8_t)((val >> 8) & 0xFF),
              (uint8_t)(val & 0xFF)
            };
      - ble_client.ble_write: # send fet state on
          id: tethercell_device_${tethercell_number}
          service_uuid: ${uuid.service}
          characteristic_uuid: ${uuid.fet_state}
          value: [0x01]
      - lambda: |-
            ESP_LOGI("ble_client_lambda", "Send FET ON to Tethercell ${tethercell_number}");
    turn_off_action:
      - ble_client.ble_write: # send authentication pin
          id: tethercell_device_${tethercell_number}
          service_uuid: ${uuid.service}
          characteristic_uuid: ${uuid.authorization}
          value: !lambda |-
            uint32_t val = strtoul("${tethercell_pin}", nullptr, 10);
            return std::vector<uint8_t>{
              (uint8_t)((val >> 24) & 0xFF),
              (uint8_t)((val >> 16) & 0xFF),
              (uint8_t)((val >> 8) & 0xFF),
              (uint8_t)(val & 0xFF)
            };
      - ble_client.ble_write: # send fet state off
          id: tethercell_device_${tethercell_number}
          service_uuid: ${uuid.service}
          characteristic_uuid: ${uuid.fet_state}
          value: [0x00]
      - lambda: |-
            ESP_LOGI("ble_client_lambda", "Send FET OFF to Tethercell ${tethercell_number}");
